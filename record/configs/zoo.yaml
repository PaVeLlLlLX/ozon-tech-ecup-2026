# Эмбеддинги изображений и сравнение классических моделей.

embeddings:
  # Из списка организаторов, лежит в /shared_models — бюджет архива не тратит.
  model_id: Qwen/Qwen3-VL-Embedding-2B
  out_path: artifacts/embeddings/qwen3vl_emb
  max_images: 5          # кадров на товар: в прогоне №3 три кадра дали +8.8 п.п.
  image_max_side: 640
  max_pixels: 200704     # ~256 патчей на кадр
  desc_max_chars: 900
  batch_size: 4          # на 8 ГБ; при нехватке памяти батч делится пополам
  # ⚠ На ПРОГОНЕ батч свой: у проверяющей системы H100 80 ГБ, и батч 4 держит её в
  # простое, пока процессор декодирует кадры. Локально значение само ужимается по
  # нехватке видеопамяти, поэтому большое число проверке не мешает.
  inference_batch_size: 64
  loader_workers: 8      # потоков на чтение и масштабирование кадров

zoo:
  svd_text: 128          # во сколько чисел сжимать текст для деревьев
  svd_ocr: 64
  svd_emb: 256           # эмбеддинг из 2048 чисел деревьям только мешает

# Распознавание в настройках, укладывающихся в лимит контейнера.
# Замер на RTX 3060 Ti: 2 кадра при стороне 768 — 0.53 с/товар, то есть 34 минуты
# на приватные 3800 товаров при лимите 40. Индекс 5 кадров/1024 занял бы 88 минут.
ocr_shippable:
  max_side: 768
  # Ставим желаемое значение: на H100 (80 ГБ, во много раз быстрее нашей карты) пять
  # кадров укладываются, а если нет — механизм в ocr_runtime сам снизит число кадров
  # под измеренный темп. Потолок должен быть желаемым, а не самым осторожным.
  max_images: 5
  max_chars_per_image: 400
  languages: ["ru", "en"]
  batch_flush: 500
  # Кадров в одном вызове распознавателя. Поштучное чтение оставляет видеокарту
  # простаивать: на H100 замерено 0.131 с на кадр против 0.12 с на ТОВАР у модели на
  # два миллиарда параметров по тем же фотографиям. Время уходит на запуск ядер и
  # подготовку картинок, а не на счёт. Значение подобрано под 80 ГБ видеопамяти
  # проверяющей системы; на нашей карте столько не нужно, но лишнего расхода нет —
  # кадры готовятся по мере надобности.
  batch_size: 64
  out_path: artifacts/ocr/ocr_index_fast.parquet
