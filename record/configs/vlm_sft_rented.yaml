# Профиль арендованной карты. Накладывается ПОВЕРХ configs/vlm_sft.yaml:
#
#     python scripts/train_vlm_sft.py --config configs/vlm_sft_rented.yaml --name ...
#
# ⚠ Локальные запуски этот файл не передают и работают ровно как раньше: на RTX 3060 Ti
# 8 ГБ нужны 4 бита, пересчёт активаций и батч 1, и ломать эту настройку нельзя — на ней
# продолжаем учить локально, пока считает арендованная карта.
#
# Здесь собраны две вещи: конфигурация РЕКОРДА (0.8641), которая до сих пор жила только
# строкой оверрайдов в docs/reproduce_record.local.md, и настройки под чужое железо.

vlm:
  # --- конфигурация рекорда: менять только осознанно, это опора сравнения ---
  model_id: Qwen/Qwen3-VL-4B-Instruct
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                        "gate_proj", "up_proj", "down_proj"]
  use_all_data: true          # не выбрасывать негативы ради балансировки редкой
  max_samples: 13000          # больше, чем строк в обучении — то есть «все»
  max_images: 5
  image_max_side: 640
  max_pixels: 100352
  desc_max_chars: 900
  epochs: 3
  lr: 1.0e-4
  warmup_steps: 10
  seed: 42

  # --- железо аренды ---
  # ⚠ bf16 вместо 4 бит NF4: квантование нужно было только чтобы влезть в 8 ГБ, а на
  # 24 ГБ оно лишь замедляет — распаковка весов идёт на каждом умножении.
  load_in_4bit: false
  # ⚠ Пересчёт активаций тоже был платой за 8 ГБ. На 24 ГБ решает калибровка: либо
  # батч ~4 без пересчёта, либо батч ~16 с ним. Значение ниже — стартовое.
  gradient_checkpointing: false
  # ⚠ ЭФФЕКТИВНЫЙ РАЗМЕР БАТЧА ДОЛЖЕН ОСТАВАТЬСЯ 16 (batch_size * grad_accum).
  # Рекорд обучен при 1×16. Меняя произведение, мы меняем не скорость, а саму
  # оптимизацию, и сравнение с рекордом перестаёт быть сравнением одной оси.
  batch_size: 4
  grad_accum: 4
  # Кадры декодируются на процессоре: пять снимков на пример. При двух потоках быстрая
  # карта будет ждать процессор — это ровно тот простой, из-за которого «H100 даёт 1.3×».
  num_workers: 12
  logging_steps: 25

  # Упавший прогон на арендованной карте — это выброшенные рубли. Сохраняемся часто;
  # продолжение включается флагом --resume у train_vlm_sft.py.
  save_strategy: "steps"
  save_steps: 200
  save_total_limit: 4

  # Оценка идёт там же, сразу после обучения: скоры холдаута нужны для порогов и связки,
  # а везти их домой — это мегабайты вместо часов.
  eval_batch_size: 8
  inference_batch_size: 32
  loader_workers: 12
