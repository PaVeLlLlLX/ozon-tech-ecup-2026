# Текстовый бейзлайн: tf-idf + логистическая регрессия отдельно по каждой категории.
# Роль — честная нижняя граница и запасной путь в контейнере (не требует GPU и весов).

baseline:
  name: tfidf_logreg
  use_ocr: false          # добавлять ли распознанный с фото текст во вход
  use_rule_features: true # улики по правилам как дополнительные признаки

  word:
    max_features: 200000
    ngram_range: [1, 2]
    min_df: 2
    sublinear_tf: true
  char:
    enabled: true
    max_features: 200000
    ngram_range: [3, 5]
    min_df: 3
    sublinear_tf: true

  logreg:
    C: 4.0
    max_iter: 2000
    class_weight: balanced

  # Текст карточки: сколько символов описания брать (хвост длинных описаний — вода)
  desc_max_chars: 2500

ocr:
  max_side: 1024        # длинная сторона перед распознаванием
  max_chars_per_image: 400
  max_images: 5
  languages: ["ru", "en"]
  batch_flush: 25       # как часто сбрасывать индекс на диск (устойчивость к перезапуску).
                        # ⚠ было 500: при скорости ~1 товар/с прогон не доживал до первого
                        # сброса и терял всю работу целиком. Запись индекса дешёвая.
